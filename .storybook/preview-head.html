<!-- SLDS 2 CSS served from the npm package @salesforce-ux/design-system-2 (latest),
     mapped to /slds2 in .storybook/main.ts. The bundled Lightning Blue theme is the
     SLDS 2 default and includes the light-dark() color functions and @layer cascade. -->
<link rel="stylesheet" href="/slds2/bundled/slds2.lightning-blue.css" />

<style>
  /* Apply light color scheme by default */
  body {
    color-scheme: light dark;
  }
  
  body.slds-color-scheme--light {
    color-scheme: only light;
  }
  
  body.slds-color-scheme--dark {
    color-scheme: only dark;
  }
</style>
