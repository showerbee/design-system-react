<!-- SLDS Plus CSS with light-dark() color functions -->
<link rel="stylesheet" href="/assets/styles/slds-plus.css" />

<style>
  /* Apply light color scheme by default */
  body {
    color-scheme: light dark;
  }
  
  body.slds-color-scheme--light {
    color-scheme: only light;
  }
  
  body.slds-color-scheme--dark {
    color-scheme: only dark;
  }
</style>
