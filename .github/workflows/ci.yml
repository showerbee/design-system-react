name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main, 'feat/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci

      # Blocking gates — these pass today and must stay green.
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm run test:coverage -- --run
      - name: Build
        run: npm run build

      # Non-blocking during modernization: the repo currently has ~379 lint
      # errors (deprecated React APIs, strict FP rules, ESLint/tsconfig config
      # drift) tracked as P4 in the modernization roadmap. Surfaced here for
      # visibility without failing the build. Flip to a blocking step once the
      # backlog is cleared.
      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true
